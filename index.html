<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Invaders</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#gameContainer {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
canvas {
  display: block;
  image-rendering: pixelated;
  border: 2px solid #33ff33;
  box-shadow: 0 0 20px rgba(51, 255, 51, 0.3), inset 0 0 20px rgba(51, 255, 51, 0.05);
}
#hud {
  position: absolute;
  top: 8px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 16px;
  color: #fff;
  font-size: 16px;
  pointer-events: none;
  z-index: 5;
}
#mobileControls {
  display: none;
  width: 100%;
  max-width: 480px;
  padding: 10px 0;
  gap: 10px;
  justify-content: space-between;
  align-items: center;
}
.ctrl-group {
  display: flex;
  gap: 8px;
}
.ctrl-btn {
  width: 64px;
  height: 64px;
  border: 2px solid #33ff33;
  border-radius: 12px;
  background: rgba(51, 255, 51, 0.1);
  color: #33ff33;
  font-size: 28px;
  font-family: 'Courier New', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s;
}
.ctrl-btn:active, .ctrl-btn.active {
  background: rgba(51, 255, 51, 0.35);
  box-shadow: 0 0 12px rgba(51, 255, 51, 0.5);
}
.ctrl-btn.fire {
  width: 100px;
  height: 64px;
  font-size: 16px;
  letter-spacing: 2px;
  border-color: #ff3333;
  color: #ff3333;
  background: rgba(255, 51, 51, 0.1);
}
.ctrl-btn.fire:active, .ctrl-btn.fire.active {
  background: rgba(255, 51, 51, 0.35);
  box-shadow: 0 0 12px rgba(255, 51, 51, 0.5);
}
#overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  background: rgba(0,0,0,0.85);
  cursor: pointer;
}
#overlay.hidden { display: none; }
#overlay h1 {
  color: #33ff33;
  font-size: 36px;
  text-shadow: 0 0 20px #33ff33;
  margin-bottom: 8px;
  letter-spacing: 4px;
}
#overlay .subtitle {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 30px;
}
#overlay .start-msg {
  color: #33ff33;
  font-size: 18px;
  animation: blink 1s infinite;
}
#overlay .controls-info {
  color: #888;
  font-size: 12px;
  margin-top: 20px;
  text-align: center;
  line-height: 1.8;
}
#overlay .game-over-score {
  color: #ff3333;
  font-size: 28px;
  margin: 10px 0;
}
#overlay .high-score-msg {
  color: #ffcc00;
  font-size: 16px;
  margin-bottom: 10px;
}
.invader-art {
  color: #33ff33;
  font-size: 11px;
  line-height: 1.15;
  white-space: pre;
  margin-bottom: 20px;
  text-shadow: 0 0 8px rgba(51, 255, 51, 0.5);
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
@media (pointer: coarse) {
  #mobileControls { display: flex; }
}
@media (max-width: 520px) {
  #hud { font-size: 13px; padding: 0 8px; }
  #overlay h1 { font-size: 24px; }
  .invader-art { font-size: 8px; }
}
</style>
</head>
<body>
<div id="gameContainer">
  <div id="hud">
    <span id="scoreDisplay">SCORE: 0</span>
    <span id="highDisplay">HI: 0</span>
    <span id="livesDisplay">LIVES: 3</span>
  </div>
  <canvas id="game"></canvas>
  <div id="overlay">
    <pre class="invader-art">
    ▄██▄
   ██████
  ██▀██▀██
  ▀ ▄██▄ ▀
    ▀  ▀
    </pre>
    <h1>SPACE INVADERS</h1>
    <div class="subtitle">ATARI CLASSIC REMAKE</div>
    <div class="start-msg" id="startMsg">TAP TO START</div>
    <div class="controls-info" id="controlsInfo">
      ← → MOVE &nbsp; SPACE FIRE &nbsp; P PAUSE
    </div>
  </div>
  <div id="mobileControls">
    <div class="ctrl-group">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <button class="ctrl-btn fire" id="btnFire">FIRE</button>
  </div>
</div>

<script>
// ===== GAME CONSTANTS =====
const GAME_W = 480;
const GAME_H = 640;
const PLAYER_W = 40;
const PLAYER_H = 20;
const PLAYER_SPEED = 5;
const BULLET_SPEED = 8;
const BULLET_W = 3;
const BULLET_H = 12;
const ENEMY_BULLET_SPEED = 4;
const INVADER_ROWS = 5;
const INVADER_COLS = 11;
const INVADER_W = 28;
const INVADER_H = 20;
const INVADER_PAD_X = 12;
const INVADER_PAD_Y = 12;
const INVADER_TOP = 60;
const SHIELD_COUNT = 4;
const SHIELD_W = 44;
const SHIELD_H = 32;
const SHIELD_Y_OFFSET = 120;
const UFO_W = 36;
const UFO_H = 14;
const UFO_SPEED = 2;
const FIRE_COOLDOWN = 350;
const STAR_COUNT = 80;

// ===== CANVAS SETUP =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startMsg = document.getElementById('startMsg');
const controlsInfo = document.getElementById('controlsInfo');
const scoreDisplay = document.getElementById('scoreDisplay');
const highDisplay = document.getElementById('highDisplay');
const livesDisplay = document.getElementById('livesDisplay');

let scale = 1;
function resize() {
  const maxW = window.innerWidth - 4;
  const maxH = window.innerHeight - (window.matchMedia('(pointer: coarse)').matches ? 100 : 20);
  scale = Math.min(maxW / GAME_W, maxH / GAME_H, 1.5);
  canvas.width = GAME_W;
  canvas.height = GAME_H;
  canvas.style.width = (GAME_W * scale) + 'px';
  canvas.style.height = (GAME_H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ===== AUDIO (Web Audio API — tiny synth) =====
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, duration, type = 'square', vol = 0.12) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function sfxShoot() { playSound(880, 0.1, 'square', 0.08); }
function sfxHit() { playSound(220, 0.15, 'sawtooth', 0.1); }
function sfxExplosion() { playSound(80, 0.4, 'sawtooth', 0.15); }
function sfxUfo() { playSound(440, 0.08, 'sine', 0.06); }
function sfxPlayerDeath() {
  playSound(300, 0.1, 'sawtooth', 0.12);
  setTimeout(() => playSound(200, 0.15, 'sawtooth', 0.12), 100);
  setTimeout(() => playSound(100, 0.3, 'sawtooth', 0.15), 200);
}

// ===== INVADER PIXEL ART =====
// Each invader type is an array of strings representing pixel rows
const INVADER_SPRITES = {
  // Type A (top row) — squid
  a: {
    frame1: [
      '  0    0  ',
      '   0  0   ',
      '  000000  ',
      ' 00 00 00 ',
      '0000000000',
      '0 000000 0',
      '0 0    0 0',
      '   00 00  ',
    ],
    frame2: [
      '  0    0  ',
      '0  0  0  0',
      '0 000000 0',
      '00 00 00 0',
      '0000000000',
      '  000000  ',
      '  0    0  ',
      ' 0      0 ',
    ]
  },
  // Type B (middle rows) — crab
  b: {
    frame1: [
      ' 00    00 ',
      '  000000  ',
      ' 00000000 ',
      '000 00 000',
      '0000000000',
      '  0 00 0  ',
      ' 0  00  0 ',
      '0 0    0 0',
    ],
    frame2: [
      ' 00    00 ',
      '  000000  ',
      ' 00000000 ',
      '000 00 000',
      '0000000000',
      '0 0 00 0 0',
      '00      00',
      '  0    0  ',
    ]
  },
  // Type C (bottom rows) — octopus
  c: {
    frame1: [
      '   0000   ',
      ' 00000000 ',
      '0000000000',
      '000  00 00',
      '0000000000',
      '  00  00  ',
      ' 00 00 00 ',
      '00      00',
    ],
    frame2: [
      '   0000   ',
      ' 00000000 ',
      '0000000000',
      '000  00 00',
      '0000000000',
      '  00  00  ',
      ' 0 0  0 0 ',
      '0  0  0  0',
    ]
  }
};

function drawSprite(sprite, x, y, w, h, color) {
  const rows = sprite.length;
  const cols = sprite[0].length;
  const pw = w / cols;
  const ph = h / rows;
  ctx.fillStyle = color;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (sprite[r][c] === '0') {
        ctx.fillRect(x + c * pw, y + r * ph, pw + 0.5, ph + 0.5);
      }
    }
  }
}

// Player ship sprite
const PLAYER_SPRITE = [
  '         00         ',
  '        0000        ',
  '        0000        ',
  '   00000000000000   ',
  '  0000000000000000  ',
  ' 000000000000000000 ',
  '00000000000000000000',
  '00000000000000000000',
];

// UFO sprite
const UFO_SPRITE = [
  '      000000      ',
  '   000000000000   ',
  '  00000000000000  ',
  ' 00 00 00 00 00 0 ',
  '000000000000000000',
  '   000  00  000   ',
  '    0        0    ',
];

// ===== STARS =====
let stars = [];
function initStars() {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * GAME_W,
      y: Math.random() * GAME_H,
      size: Math.random() * 1.5 + 0.5,
      brightness: Math.random() * 0.5 + 0.2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
}

function drawStars(time) {
  for (const s of stars) {
    const alpha = s.brightness + Math.sin(time * s.twinkleSpeed + s.twinkleOffset) * 0.15;
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.05, alpha)})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
}

// ===== PARTICLES =====
let particles = [];
function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: Math.random() * 0.03 + 0.02,
      size: Math.random() * 3 + 1,
      color,
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ===== SHIELDS =====
function createShields() {
  const shields = [];
  const startX = (GAME_W - (SHIELD_COUNT * SHIELD_W + (SHIELD_COUNT - 1) * 40)) / 2;
  const y = GAME_H - SHIELD_Y_OFFSET;
  for (let i = 0; i < SHIELD_COUNT; i++) {
    const x = startX + i * (SHIELD_W + 40);
    // Create pixel grid for shield
    const pixels = [];
    for (let py = 0; py < SHIELD_H; py++) {
      pixels[py] = [];
      for (let px = 0; px < SHIELD_W; px++) {
        // Shield shape: dome top, flat bottom with notch
        const cx = SHIELD_W / 2;
        const distFromCenter = Math.abs(px - cx);
        const topCurve = py < 8 ? (8 - py) * 2.5 : 0;
        // Bottom notch
        const isNotch = py > SHIELD_H - 12 && distFromCenter < 8;
        pixels[py][px] = distFromCenter < (cx - topCurve) && !isNotch ? 1 : 0;
      }
    }
    shields.push({ x, y, pixels });
  }
  return shields;
}

function drawShields(shields) {
  for (const s of shields) {
    for (let py = 0; py < SHIELD_H; py++) {
      for (let px = 0; px < SHIELD_W; px++) {
        if (s.pixels[py][px]) {
          ctx.fillStyle = '#33ff33';
          ctx.fillRect(s.x + px, s.y + py, 1, 1);
        }
      }
    }
  }
}

function damageShield(shield, hitX, hitY, radius = 4) {
  const localX = Math.floor(hitX - shield.x);
  const localY = Math.floor(hitY - shield.y);
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (dx * dx + dy * dy <= radius * radius) {
        const py = localY + dy;
        const px = localX + dx;
        if (py >= 0 && py < SHIELD_H && px >= 0 && px < SHIELD_W) {
          shield.pixels[py][px] = 0;
        }
      }
    }
  }
}

// ===== GAME STATE =====
let state = 'start'; // start, playing, paused, gameover
let score = 0;
let highScore = parseInt(localStorage.getItem('si_highscore') || '0');
let lives = 3;
let level = 1;
let animFrame = 0;
let animTimer = 0;
let moveTimer = 0;
let moveInterval = 600; // ms between invader steps
let lastFireTime = 0;
let gameTime = 0;

// Player
let player = { x: GAME_W / 2 - PLAYER_W / 2, y: GAME_H - 50 };
let playerBullets = [];
let playerInvincible = 0;

// Invaders
let invaders = [];
let invaderDir = 1; // 1 = right, -1 = left
let invaderBullets = [];
let invaderSpeedBoost = 0;

// UFO
let ufo = null;
let ufoTimer = 0;
let ufoInterval = 15000 + Math.random() * 10000;

// Shields
let shields = [];

// Input
const keys = {};
let mobileLeft = false;
let mobileRight = false;
let mobileFire = false;

// ===== INVADER CREATION =====
function createInvaders() {
  invaders = [];
  const totalW = INVADER_COLS * (INVADER_W + INVADER_PAD_X) - INVADER_PAD_X;
  const startX = (GAME_W - totalW) / 2;
  for (let row = 0; row < INVADER_ROWS; row++) {
    for (let col = 0; col < INVADER_COLS; col++) {
      let type, color, points;
      if (row === 0) { type = 'a'; color = '#ff3333'; points = 30; }
      else if (row <= 2) { type = 'b'; color = '#33ccff'; points = 20; }
      else { type = 'c'; color = '#33ff33'; points = 10; }
      invaders.push({
        x: startX + col * (INVADER_W + INVADER_PAD_X),
        y: INVADER_TOP + row * (INVADER_H + INVADER_PAD_Y),
        type, color, points,
        alive: true,
      });
    }
  }
}

// ===== GAME INIT =====
function initGame(keepScore = false) {
  if (!keepScore) {
    score = 0;
    lives = 3;
    level = 1;
  }
  player.x = GAME_W / 2 - PLAYER_W / 2;
  playerBullets = [];
  invaderBullets = [];
  invaderDir = 1;
  invaderSpeedBoost = 0;
  moveInterval = Math.max(150, 600 - (level - 1) * 50);
  moveTimer = 0;
  animTimer = 0;
  animFrame = 0;
  ufo = null;
  ufoTimer = 0;
  ufoInterval = 15000 + Math.random() * 10000;
  playerInvincible = 0;
  particles = [];
  createInvaders();
  shields = createShields();
  initStars();
}

// ===== INPUT HANDLING =====
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  if (state === 'start' && (e.key === ' ' || e.key === 'Enter')) {
    initAudio();
    initGame();
    state = 'playing';
    overlay.classList.add('hidden');
  }
  if (state === 'gameover' && (e.key === ' ' || e.key === 'Enter')) {
    initGame();
    state = 'playing';
    overlay.classList.add('hidden');
  }
  if (state === 'playing' && (e.key === 'p' || e.key === 'P' || e.key === 'Escape')) {
    state = 'paused';
    showPauseOverlay();
  } else if (state === 'paused' && (e.key === 'p' || e.key === 'P' || e.key === 'Escape')) {
    state = 'playing';
    overlay.classList.add('hidden');
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Overlay click/tap — shared handler for both click and touch
function handleOverlayTap(e) {
  e.preventDefault();
  e.stopPropagation();
  initAudio();
  if (state === 'start') {
    initGame();
    state = 'playing';
    overlay.classList.add('hidden');
  } else if (state === 'gameover') {
    initGame();
    state = 'playing';
    overlay.classList.add('hidden');
  } else if (state === 'paused') {
    state = 'playing';
    overlay.classList.add('hidden');
  }
}
overlay.addEventListener('click', handleOverlayTap);
overlay.addEventListener('touchend', handleOverlayTap, { passive: false });

// Helper to start game from any touch if not playing
function tryStartFromTouch() {
  initAudio();
  if (state === 'start' || state === 'gameover') {
    initGame();
    state = 'playing';
    overlay.classList.add('hidden');
    return true;
  }
  return false;
}

// Mobile controls
function setupMobileBtn(id, onDown, onUp) {
  const btn = document.getElementById(id);
  const start = e => {
    e.preventDefault();
    if (tryStartFromTouch()) return;
    onDown();
    btn.classList.add('active');
  };
  const end = e => { e.preventDefault(); onUp(); btn.classList.remove('active'); };
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', end, { passive: false });
  btn.addEventListener('touchcancel', end, { passive: false });
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
}

setupMobileBtn('btnLeft', () => { mobileLeft = true; }, () => { mobileLeft = false; });
setupMobileBtn('btnRight', () => { mobileRight = true; }, () => { mobileRight = false; });
setupMobileBtn('btnFire', () => { mobileFire = true; }, () => { mobileFire = false; });

// Canvas touch — tap to fire, swipe left/right to move
let touchStartX = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (tryStartFromTouch()) return;
  if (state !== 'playing') return;
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  mobileFire = true;
  setTimeout(() => { mobileFire = false; }, 100);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state !== 'playing' || touchStartX === null) return;
  const touch = e.touches[0];
  const dx = touch.clientX - touchStartX;
  const threshold = 10;
  mobileLeft = dx < -threshold;
  mobileRight = dx > threshold;
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  touchStartX = null;
  mobileLeft = false;
  mobileRight = false;
}, { passive: false });

// ===== OVERLAYS =====
function showGameOver() {
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('si_highscore', highScore);
  }
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1 style="color:#ff3333">GAME OVER</h1>
    <div class="game-over-score">SCORE: ${score}</div>
    ${score >= highScore ? '<div class="high-score-msg">★ NEW HIGH SCORE ★</div>' : ''}
    <div class="subtitle">WAVE ${level}</div>
    <div class="start-msg">TAP TO PLAY AGAIN</div>
  `;
}

function showPauseOverlay() {
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>PAUSED</h1>
    <div class="start-msg">TAP TO RESUME</div>
    <div class="controls-info">P / ESC — PAUSE<br>← → — MOVE<br>SPACE — FIRE</div>
  `;
}

function showWaveOverlay() {
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1 style="color:#ffcc00">WAVE ${level}</h1>
    <div class="subtitle">GET READY</div>
  `;
  setTimeout(() => {
    if (state === 'playing') overlay.classList.add('hidden');
  }, 1500);
}

// ===== UPDATE =====
let lastTime = 0;
function update(dt) {
  if (state !== 'playing') return;
  gameTime += dt;

  // --- Player movement ---
  const moveLeft = keys['ArrowLeft'] || keys['a'] || keys['A'] || mobileLeft;
  const moveRight = keys['ArrowRight'] || keys['d'] || keys['D'] || mobileRight;
  if (moveLeft) player.x -= PLAYER_SPEED;
  if (moveRight) player.x += PLAYER_SPEED;
  player.x = Math.max(4, Math.min(GAME_W - PLAYER_W - 4, player.x));

  // --- Player shooting ---
  const wantsFire = keys[' '] || keys['ArrowUp'] || mobileFire;
  const now = performance.now();
  if (wantsFire && now - lastFireTime > FIRE_COOLDOWN) {
    playerBullets.push({ x: player.x + PLAYER_W / 2 - BULLET_W / 2, y: player.y - BULLET_H });
    sfxShoot();
    lastFireTime = now;
  }

  // --- Player bullets ---
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    playerBullets[i].y -= BULLET_SPEED;
    if (playerBullets[i].y < -BULLET_H) {
      playerBullets.splice(i, 1);
    }
  }

  // --- Invader movement ---
  moveTimer += dt;
  const aliveCount = invaders.filter(inv => inv.alive).length;
  const speedMult = aliveCount <= 5 ? 3 : aliveCount <= 15 ? 2 : aliveCount <= 30 ? 1.4 : 1;
  const effectiveInterval = moveInterval / speedMult;

  if (moveTimer >= effectiveInterval) {
    moveTimer = 0;
    animFrame = 1 - animFrame;

    // Check bounds
    let hitEdge = false;
    for (const inv of invaders) {
      if (!inv.alive) continue;
      if (invaderDir === 1 && inv.x + INVADER_W >= GAME_W - 10) hitEdge = true;
      if (invaderDir === -1 && inv.x <= 10) hitEdge = true;
    }

    if (hitEdge) {
      invaderDir *= -1;
      for (const inv of invaders) {
        if (inv.alive) inv.y += 12;
      }
    } else {
      for (const inv of invaders) {
        if (inv.alive) inv.x += 6 * invaderDir;
      }
    }

    // Invader shooting
    const shooters = getBottomInvaders();
    if (shooters.length > 0 && Math.random() < 0.4 + level * 0.05) {
      const shooter = shooters[Math.floor(Math.random() * shooters.length)];
      invaderBullets.push({
        x: shooter.x + INVADER_W / 2 - 2,
        y: shooter.y + INVADER_H,
      });
    }
  }

  // --- Invader bullets ---
  for (let i = invaderBullets.length - 1; i >= 0; i--) {
    invaderBullets[i].y += ENEMY_BULLET_SPEED + level * 0.3;
    if (invaderBullets[i].y > GAME_H) {
      invaderBullets.splice(i, 1);
    }
  }

  // --- UFO ---
  ufoTimer += dt;
  if (!ufo && ufoTimer >= ufoInterval) {
    ufo = { x: -UFO_W, y: 30, dir: 1 };
    if (Math.random() > 0.5) { ufo.x = GAME_W; ufo.dir = -1; }
    ufoTimer = 0;
    ufoInterval = 15000 + Math.random() * 10000;
  }
  if (ufo) {
    ufo.x += UFO_SPEED * ufo.dir;
    if (ufo.x > GAME_W + UFO_W || ufo.x < -UFO_W * 2) ufo = null;
  }

  // --- Collisions: player bullets vs invaders ---
  for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
    const b = playerBullets[bi];
    let hit = false;
    for (const inv of invaders) {
      if (!inv.alive) continue;
      if (b.x + BULLET_W > inv.x && b.x < inv.x + INVADER_W &&
          b.y + BULLET_H > inv.y && b.y < inv.y + INVADER_H) {
        inv.alive = false;
        score += inv.points;
        hit = true;
        sfxHit();
        spawnParticles(inv.x + INVADER_W / 2, inv.y + INVADER_H / 2, inv.color, 15);
        break;
      }
    }
    // Player bullet vs UFO
    if (!hit && ufo) {
      if (b.x + BULLET_W > ufo.x && b.x < ufo.x + UFO_W &&
          b.y + BULLET_H > ufo.y && b.y < ufo.y + UFO_H) {
        const ufoPoints = [50, 100, 150, 200, 300][Math.floor(Math.random() * 5)];
        score += ufoPoints;
        spawnParticles(ufo.x + UFO_W / 2, ufo.y + UFO_H / 2, '#ff00ff', 20);
        sfxExplosion();
        // Show points
        particles.push({
          x: ufo.x + UFO_W / 2, y: ufo.y,
          vx: 0, vy: -0.5,
          life: 1, decay: 0.015,
          size: 0, color: '#ff00ff',
          text: '+' + ufoPoints,
        });
        ufo = null;
        hit = true;
      }
    }
    // Player bullet vs shields
    if (!hit) {
      for (const shield of shields) {
        if (b.x + BULLET_W > shield.x && b.x < shield.x + SHIELD_W &&
            b.y + BULLET_H > shield.y && b.y < shield.y + SHIELD_H) {
          const lx = Math.floor(b.x - shield.x + BULLET_W / 2);
          const ly = Math.floor(b.y - shield.y);
          if (ly >= 0 && ly < SHIELD_H && lx >= 0 && lx < SHIELD_W && shield.pixels[ly]?.[lx]) {
            damageShield(shield, b.x + BULLET_W / 2, b.y, 3);
            hit = true;
            break;
          }
        }
      }
    }
    if (hit) playerBullets.splice(bi, 1);
  }

  // --- Collisions: invader bullets vs player ---
  if (playerInvincible > 0) {
    playerInvincible -= dt;
  }
  for (let i = invaderBullets.length - 1; i >= 0; i--) {
    const b = invaderBullets[i];
    // vs shields
    let shieldHit = false;
    for (const shield of shields) {
      if (b.x + 4 > shield.x && b.x < shield.x + SHIELD_W &&
          b.y + 8 > shield.y && b.y < shield.y + SHIELD_H) {
        const lx = Math.floor(b.x - shield.x + 2);
        const ly = Math.floor(b.y + 8 - shield.y);
        if (ly >= 0 && ly < SHIELD_H && lx >= 0 && lx < SHIELD_W && shield.pixels[Math.min(ly, SHIELD_H - 1)]?.[lx]) {
          damageShield(shield, b.x + 2, b.y + 8, 4);
          invaderBullets.splice(i, 1);
          shieldHit = true;
          break;
        }
      }
    }
    if (shieldHit) continue;

    // vs player
    if (playerInvincible <= 0 &&
        b.x + 4 > player.x && b.x < player.x + PLAYER_W &&
        b.y + 8 > player.y && b.y < player.y + PLAYER_H) {
      lives--;
      sfxPlayerDeath();
      spawnParticles(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2, '#33ff33', 25);
      invaderBullets.splice(i, 1);
      playerInvincible = 2000;
      if (lives <= 0) {
        state = 'gameover';
        showGameOver();
        return;
      }
    }
  }

  // --- Invaders reaching player level ---
  for (const inv of invaders) {
    if (inv.alive && inv.y + INVADER_H >= player.y) {
      lives = 0;
      state = 'gameover';
      sfxPlayerDeath();
      showGameOver();
      return;
    }
  }

  // --- Wave clear ---
  if (invaders.every(inv => !inv.alive)) {
    level++;
    initGame(true);
    showWaveOverlay();
  }

  // --- Particles ---
  updateParticles();

  // --- HUD ---
  scoreDisplay.textContent = 'SCORE: ' + score;
  highDisplay.textContent = 'HI: ' + Math.max(highScore, score);
  livesDisplay.textContent = 'LIVES: ' + lives;
}

function getBottomInvaders() {
  const cols = {};
  for (const inv of invaders) {
    if (!inv.alive) continue;
    const col = Math.round(inv.x / (INVADER_W + INVADER_PAD_X));
    if (!cols[col] || inv.y > cols[col].y) {
      cols[col] = inv;
    }
  }
  return Object.values(cols);
}

// ===== DRAW =====
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  // Stars
  drawStars(gameTime);

  // Ground line
  ctx.fillStyle = '#33ff33';
  ctx.fillRect(0, GAME_H - 20, GAME_W, 1);

  // Shields
  drawShields(shields);

  // Invaders
  for (const inv of invaders) {
    if (!inv.alive) continue;
    const sprites = INVADER_SPRITES[inv.type];
    const frame = animFrame === 0 ? sprites.frame1 : sprites.frame2;
    drawSprite(frame, inv.x, inv.y, INVADER_W, INVADER_H, inv.color);
  }

  // UFO
  if (ufo) {
    drawSprite(UFO_SPRITE, ufo.x, ufo.y, UFO_W, UFO_H, '#ff00ff');
    // Glow
    ctx.shadowColor = '#ff00ff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = 'rgba(255, 0, 255, 0.08)';
    ctx.fillRect(ufo.x - 4, ufo.y - 2, UFO_W + 8, UFO_H + 4);
    ctx.shadowBlur = 0;
  }

  // Player
  if (playerInvincible > 0 && Math.floor(gameTime / 100) % 2 === 0) {
    // Blinking when invincible
  } else {
    drawSprite(PLAYER_SPRITE, player.x, player.y, PLAYER_W, PLAYER_H, '#33ff33');
    // Engine glow
    ctx.fillStyle = 'rgba(51, 255, 51, 0.3)';
    ctx.fillRect(player.x + PLAYER_W / 2 - 3, player.y + PLAYER_H, 6, 4 + Math.sin(gameTime * 0.01) * 2);
  }

  // Player bullets
  ctx.fillStyle = '#ffff33';
  ctx.shadowColor = '#ffff33';
  ctx.shadowBlur = 6;
  for (const b of playerBullets) {
    ctx.fillRect(b.x, b.y, BULLET_W, BULLET_H);
  }
  ctx.shadowBlur = 0;

  // Invader bullets (zigzag style)
  for (const b of invaderBullets) {
    ctx.fillStyle = '#ff3333';
    const zigzag = Math.sin(b.y * 0.3) * 2;
    ctx.fillRect(b.x + zigzag, b.y, 3, 4);
    ctx.fillRect(b.x - zigzag, b.y + 4, 3, 4);
  }

  // Particles
  drawParticles();

  // Score text particles
  for (const p of particles) {
    if (p.text) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.font = '14px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  }

  // Lives display as small ships
  for (let i = 0; i < lives - 1; i++) {
    drawSprite(PLAYER_SPRITE, 10 + i * 24, GAME_H - 14, 16, 8, '#33ff33');
  }

  // Level display
  ctx.fillStyle = '#888';
  ctx.font = '11px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('WAVE ' + level, GAME_W / 2, GAME_H - 6);
  ctx.textAlign = 'left';

  // Pause indicator
  if (state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
  }
}

// ===== GAME LOOP =====
function gameLoop(timestamp) {
  const dt = lastTime ? timestamp - lastTime : 16;
  lastTime = timestamp;

  update(Math.min(dt, 50));
  draw();
  requestAnimationFrame(gameLoop);
}

// ===== DETECT DEVICE =====
if (!window.matchMedia('(pointer: coarse)').matches) {
  startMsg.textContent = 'PRESS SPACE TO START';
  controlsInfo.innerHTML = '← → MOVE &nbsp; SPACE FIRE &nbsp; P PAUSE';
}

// Start the loop
highDisplay.textContent = 'HI: ' + highScore;
initStars();
requestAnimationFrame(gameLoop);
</script>
